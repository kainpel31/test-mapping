name: Tauri Build Windows EXE

on:
  workflow_dispatch:
    # Allows manual triggering from the Actions tab
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    env:
      TAURI_PLATFORM: "windows"
      PKG_CONFIG_ALLOW_CROSS: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          components: clippy, rustfmt

      - name: Install Chocolatey
        run: Set-ExecutionPolicy Bypass -Scope Process -Force

      - name: Install Chocolatey packages
        run: choco install -y git libwebp libpng sqlite3 libcurl zlib libssl OpenSSL nodejs wget ffmpeg

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/tauri-cli

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build Tauri APP
        run: npm run tauri build

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: scrcpy-gui-windows-exe
          path: src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: warn

